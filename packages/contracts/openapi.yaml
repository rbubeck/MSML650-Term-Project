---
openapi: 3.1.0
info:
  title: Live Transcription Control API
  version: 0.1.0-proposed
  description: Proposed v1 control-plane contract; not deployed.
servers:
- url: https://api.example.invalid
  description: Placeholder only
security:
- cognitoAccessToken: []
paths:
  "/v1/users/me":
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserProfile"
        default:
          "$ref": "#/components/responses/ErrorResponse"
    patch:
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateProfileRequest"
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserProfile"
        default:
          "$ref": "#/components/responses/ErrorResponse"
  "/v1/sessions":
    post:
      operationId: createSession
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSessionRequest"
      responses:
        '201':
          description: Session and one-time connection ticket created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateSessionResponse"
        default:
          "$ref": "#/components/responses/ErrorResponse"
    get:
      operationId: listSessions
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: status
        in: query
        schema:
          type: array
          items:
            "$ref": "#/components/schemas/SessionStatus"
        explode: true
      responses:
        '200':
          description: Owner-scoped session page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionPage"
        default:
          "$ref": "#/components/responses/ErrorResponse"
  "/v1/sessions/{sessionId}":
    parameters:
    - "$ref": "#/components/parameters/SessionId"
    get:
      operationId: getSession
      responses:
        '200':
          description: Owner-scoped session detail
          content:
            application/json:
              schema:
                type: object
                required:
                - session
                - segments
                properties:
                  session:
                    "$ref": "#/components/schemas/Session"
                  segments:
                    "$ref": "#/components/schemas/SegmentPage"
        default:
          "$ref": "#/components/responses/ErrorResponse"
    patch:
      operationId: renameSession
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - name: If-Match
        in: header
        required: false
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          "$ref": "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteSession
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          description: Deletion accepted and reads denied
          content:
            application/json:
              schema:
                type: object
                required:
                - sessionId
                - status
                properties:
                  sessionId:
                    type: string
                  status:
                    const: DELETING
        default:
          "$ref": "#/components/responses/ErrorResponse"
  "/v1/sessions/{sessionId}/tickets":
    parameters:
    - "$ref": "#/components/parameters/SessionId"
    post:
      operationId: issueReconnectTicket
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - lastServerSequence
              - reason
              properties:
                lastServerSequence:
                  type: integer
                  minimum: 0
                reason:
                  const: network_reconnect
      responses:
        '201':
          description: New one-time ticket
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StreamAuthorization"
        default:
          "$ref": "#/components/responses/ErrorResponse"
  "/v1/sessions/{sessionId}/complete":
    parameters:
    - "$ref": "#/components/parameters/SessionId"
    post:
      operationId: requestSessionCompletion
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          description: Finalization requested
          content:
            application/json:
              schema:
                type: object
                required:
                - sessionId
                - status
                - version
                properties:
                  sessionId:
                    type: string
                  status:
                    enum:
                    - FINALIZING
                    - COMPLETED
                    - INTERRUPTED
                    - FAILED
                  version:
                    type: integer
                    minimum: 1
        default:
          "$ref": "#/components/responses/ErrorResponse"
  "/v1/sessions/{sessionId}/download":
    parameters:
    - "$ref": "#/components/parameters/SessionId"
    - name: format
      in: query
      required: true
      schema:
        enum:
        - json
        - txt
    get:
      operationId: downloadSession
      responses:
        '302':
          description: Redirect to an owner-authorized short-lived object URL
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        default:
          "$ref": "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sess_[A-Za-z0-9_-]+$"
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    ErrorResponse:
      description: Standard application error
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: object
                required:
                - code
                - message
                - requestId
                - retryable
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
                  retryable:
                    type: boolean
                  retryAfterSeconds:
                    type:
                    - integer
                    - 'null'
                    minimum: 0
                  details:
                    type: object
  schemas:
    SessionStatus:
      enum:
      - CREATED
      - CONNECTING
      - STREAMING
      - FINALIZING
      - COMPLETED
      - INTERRUPTED
      - FAILED
      - DELETING
    Audio:
      type: object
      additionalProperties: false
      required:
      - encoding
      - sampleRateHz
      - channels
      - chunkDurationMs
      properties:
        encoding:
          const: pcm_s16le
        sampleRateHz:
          const: 16000
        channels:
          const: 1
        chunkDurationMs:
          type: integer
          minimum: 50
          maximum: 200
    Session:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - name
      - status
      - languageCode
      - audio
      - createdAt
      - startedAt
      - endedAt
      - durationMs
      - latestStreamEpoch
      - version
      - failure
      - exports
      properties:
        sessionId:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 160
        status:
          "$ref": "#/components/schemas/SessionStatus"
        languageCode:
          type: string
        audio:
          "$ref": "#/components/schemas/Audio"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        latestStreamEpoch:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        failure:
          type:
          - object
          - 'null'
        exports:
          type: array
          items:
            type: object
            properties:
              format:
                enum:
                - json
                - txt
              status:
                enum:
                - PENDING
                - READY
                - FAILED
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
      - languageCode
      - audio
      - client
      properties:
        languageCode:
          type: string
        audio:
          "$ref": "#/components/schemas/Audio"
        client:
          type: object
          additionalProperties: false
          required:
          - protocolVersion
          - timeZone
          properties:
            protocolVersion:
              const: 1
            timeZone:
              type: string
              maxLength: 100
    StreamAuthorization:
      type: object
      additionalProperties: false
      required:
      - url
      - ticket
      - ticketExpiresAt
      - protocolVersion
      properties:
        url:
          type: string
          format: uri
          pattern: "^wss://"
        ticket:
          type: string
          minLength: 32
        ticketExpiresAt:
          type: string
          format: date-time
        protocolVersion:
          const: 1
        resumeAllowed:
          type: boolean
    CreateSessionResponse:
      type: object
      additionalProperties: false
      required:
      - session
      - stream
      properties:
        session:
          "$ref": "#/components/schemas/Session"
        stream:
          "$ref": "#/components/schemas/StreamAuthorization"
    SessionPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Session"
        nextCursor:
          type:
          - string
          - 'null'
    Segment:
      type: object
      additionalProperties: false
      required:
      - segmentId
      - streamEpoch
      - startMs
      - endMs
      - text
      properties:
        segmentId:
          type: string
        streamEpoch:
          type: integer
          minimum: 1
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
        text:
          type: string
    SegmentPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Segment"
        nextCursor:
          type:
          - string
          - 'null'
    UserProfile:
      type: object
      additionalProperties: false
      required:
      - userId
      - displayName
      - preferences
      - createdAt
      - updatedAt
      properties:
        userId:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        preferences:
          type: object
          properties:
            defaultLanguageCode:
              type: string
            captionStability:
              enum:
              - low
              - medium
              - high
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        preferences:
          type: object
          properties:
            defaultLanguageCode:
              type: string
            captionStability:
              enum:
              - low
              - medium
              - high
