name: Bootstrap CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate npm workspaces
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm pkg get name --workspaces
          npm run check
      - name: Compile existing evaluation scripts and validate schemas
        run: |
          python -m compileall -q Scripts
          python -m json.tool packages/contracts/session.schema.json >/dev/null
          python -m json.tool packages/contracts/websocket.schema.json >/dev/null

  bootstrap-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required bootstrap documents
        shell: bash
        run: |
          test -f direction_option_b.md
          test -f ARCHITECTURE.md
          test -f AGENTS.md
          test -f API_CONTRACTS.md
          test -f INTEGRATION_PLAN.md
          test -f docs/security.md
          test -f docs/data-model.md
          test -f docs/streaming-protocol.md
          test -f evaluation/README.md
          test -f packages/contracts/openapi.yaml
          test -f packages/contracts/session.schema.json
          test -f packages/contracts/websocket.schema.json
          test -f tsconfig.base.json
          test -f tsconfig.json
