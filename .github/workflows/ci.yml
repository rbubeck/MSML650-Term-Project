name: Repository CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify TypeScript workspaces
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm pkg get name --workspaces
          npm run check
      - name: Compile evaluation prototypes
        run: |
          python -m compileall -q Scripts

  required-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required project documents and configuration
        shell: bash
        run: |
          test -f README.md
          test -f direction_option_a.md
          test -f ARCHITECTURE.md
          test -f AGENTS.md
          test -f API_CONTRACTS.md
          test -f INTEGRATION_PLAN.md
          test -f docs/adr/README.md
          test -f docs/security.md
          test -f docs/data-model.md
          test -f docs/streaming-protocol.md
          test -f docs/adr/010-option-a-migration.md
          test -f docs/runbooks/console-option-a-setup.md
          test -f evaluation/README.md
          test -f packages/contracts/src/audio-format.ts
          test -f packages/stream-client/README.md
          test -f backend/api/README.md
          test -f backend/persistence/README.md
          test -f infrastructure/README.md
          test -f tsconfig.base.json
          test -f tsconfig.json
