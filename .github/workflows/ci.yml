name: Repository CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify TypeScript workspaces
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm pkg get name --workspaces
          npm run check
      - name: Compile evaluation prototypes and validate JSON snapshots
        run: |
          python -m compileall -q Scripts
          python -m json.tool packages/contracts/session.schema.json >/dev/null
          python -m json.tool packages/contracts/websocket.schema.json >/dev/null

  required-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required project documents and configuration
        shell: bash
        run: |
          test -f direction_option_b.md
          test -f README.md
          test -f ARCHITECTURE.md
          test -f AGENTS.md
          test -f API_CONTRACTS.md
          test -f INTEGRATION_PLAN.md
          test -f docs/adr/README.md
          test -f docs/security.md
          test -f docs/data-model.md
          test -f docs/streaming-protocol.md
          test -f docs/runbooks/amazon-transcribe-smoke-test.md
          test -f evaluation/README.md
          test -f packages/contracts/openapi.yaml
          test -f packages/contracts/session.schema.json
          test -f packages/contracts/websocket.schema.json
          test -f packages/contracts/src/audio-frame.ts
          test -f backend/streaming/src/aws-transcribe-provider.ts
          test -f tsconfig.base.json
          test -f tsconfig.json
